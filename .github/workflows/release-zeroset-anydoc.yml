name: Release zeroset-anydoc

on:
  push:
    tags: ['zeroset-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing zeroset-v* tag to build
        required: false
        type: string
      publish:
        description: Publish the tested wheels to PyPI
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-zeroset-anydoc-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Version gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: release
        name: Resolve verified release source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const manualPublish = process.env.MANUAL_PUBLISH === 'true'
            const tagPrefix = 'refs/tags/'
            let releaseTag
            if (context.eventName === 'push') {
              const ref = process.env.GITHUB_REF || ''
              if (!ref.startsWith(tagPrefix)) {
                throw new Error(`Release push has unexpected ref: ${ref}`)
              }
              releaseTag = ref.slice(tagPrefix.length)
            } else {
              releaseTag = process.env.MANUAL_RELEASE_TAG.trim()
            }

            if (!releaseTag) {
              if (manualPublish) {
                throw new Error('A release_tag is required when publishing manually')
              }
              core.setOutput('commit', context.sha)
              core.setOutput('tag', '')
              return
            }
            if (!/^zeroset-v\d+\.\d+\.\d+$/.test(releaseTag)) {
              throw new Error(`Invalid release tag: ${releaseTag}`)
            }

            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${releaseTag}`,
            })
            if (ref.object.type !== 'tag') {
              throw new Error(`${releaseTag} is not an annotated tag`)
            }
            const { data: tag } = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: ref.object.sha,
            })
            if (tag.object.type !== 'commit') {
              throw new Error(`${releaseTag} does not point directly to a commit`)
            }
            if (!tag.verification?.verified) {
              throw new Error(
                `${releaseTag} has no verified signature: ${tag.verification?.reason}`,
              )
            }
            if (context.eventName === 'push' && tag.object.sha !== context.sha) {
              throw new Error(`${releaseTag} moved after its push event`)
            }
            core.setOutput('commit', tag.object.sha)
            core.setOutput('tag', releaseTag)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
      - id: version
        name: Verify package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version=$(sh scripts/check-zeroset-python-version.sh "$RELEASE_TAG")
          else
            version=$(sh scripts/check-zeroset-python-version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-wheels:
    name: Build wheel (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: blacksmith-8vcpu-ubuntu-2404
            manylinux: '2014'
          - target: aarch64-unknown-linux-gnu
            host: blacksmith-4vcpu-ubuntu-2404-arm
            manylinux: '2014'
          - target: x86_64-unknown-linux-musl
            host: blacksmith-8vcpu-ubuntu-2404
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            host: blacksmith-4vcpu-ubuntu-2404-arm
            manylinux: musllinux_1_2
          - target: x86_64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
          - target: aarch64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
          - target: x86_64-pc-windows-msvc
            host: blacksmith-8vcpu-windows-2025
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Linux'
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --locked --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeroset-anydoc-wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  test-wheels:
    name: Test wheel (${{ matrix.target }})
    needs: [gate, build-wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
          - target: x86_64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
            macos_x64: true
          - target: x86_64-pc-windows-msvc
            host: blacksmith-4vcpu-windows-2025
          - target: x86_64-unknown-linux-gnu
            host: blacksmith-4vcpu-ubuntu-2404
            image: python:3.13-slim
          - target: aarch64-unknown-linux-gnu
            host: blacksmith-4vcpu-ubuntu-2404-arm
            image: python:3.13-slim
          - target: x86_64-unknown-linux-musl
            host: blacksmith-4vcpu-ubuntu-2404
            image: python:3.13-alpine
          - target: aarch64-unknown-linux-musl
            host: blacksmith-4vcpu-ubuntu-2404-arm
            image: python:3.13-alpine
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !matrix.image }}
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zeroset-anydoc-wheels-${{ matrix.target }}
          path: dist
      - name: Install wheel and run tests
        if: ${{ !matrix.image && !matrix.macos_x64 }}
        run: |
          python -m pip install --no-index --find-links dist zeroset-anydoc
          python -m unittest discover -s python/tests
      - name: Install wheel and run tests in container
        if: ${{ matrix.image }}
        run: >
          docker run --rm -v ${{ github.workspace }}:/build -w /build
          ${{ matrix.image }} sh -c
          "pip install --no-index --find-links dist zeroset-anydoc &&
          python -m unittest discover -s python/tests"
      - name: Install wheel and run tests (x86_64 via Rosetta)
        if: ${{ matrix.macos_x64 }}
        run: |
          arch -x86_64 python -m pip install --no-index --find-links dist zeroset-anydoc
          arch -x86_64 python -m unittest discover -s python/tests

  publish:
    name: Publish PyPI wheels
    needs: [gate, test-wheels]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zeroset-anydoc-wheels-*
          path: dist
          merge-multiple: true
      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
