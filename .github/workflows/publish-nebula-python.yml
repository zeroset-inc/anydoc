name: Publish Nebula Python wheels

on:
  push:
    tags: ['nebula-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nebula-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Version gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Verify internal package version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(sh scripts/check-nebula-python-version.sh "$GITHUB_REF_NAME")
          else
            version=$(sh scripts/check-nebula-python-version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-wheels:
    name: Build wheel (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: blacksmith-8vcpu-ubuntu-2404
            manylinux: '2014'
          - target: aarch64-unknown-linux-gnu
            host: blacksmith-4vcpu-ubuntu-2404-arm
            manylinux: '2014'
          - target: x86_64-unknown-linux-musl
            host: blacksmith-8vcpu-ubuntu-2404
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            host: blacksmith-4vcpu-ubuntu-2404-arm
            manylinux: musllinux_1_2
          - target: x86_64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
          - target: aarch64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
          - target: x86_64-pc-windows-msvc
            host: blacksmith-8vcpu-windows-2025
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Linux'
        with:
          python-version: '3.13'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --locked --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebula-wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  test-wheels:
    name: Test wheel (${{ matrix.target }})
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
          - target: x86_64-apple-darwin
            host: blacksmith-6vcpu-macos-latest
            macos_x64: true
          - target: x86_64-pc-windows-msvc
            host: blacksmith-4vcpu-windows-2025
          - target: x86_64-unknown-linux-gnu
            host: blacksmith-4vcpu-ubuntu-2404
            image: python:3.13-slim
          - target: aarch64-unknown-linux-gnu
            host: blacksmith-4vcpu-ubuntu-2404-arm
            image: python:3.13-slim
          - target: x86_64-unknown-linux-musl
            host: blacksmith-4vcpu-ubuntu-2404
            image: python:3.13-alpine
          - target: aarch64-unknown-linux-musl
            host: blacksmith-4vcpu-ubuntu-2404-arm
            image: python:3.13-alpine
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !matrix.image }}
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nebula-wheels-${{ matrix.target }}
          path: dist
      - name: Install wheel and run tests
        if: ${{ !matrix.image && !matrix.macos_x64 }}
        run: |
          python -m pip install --no-index --find-links dist zeroset-anydoc
          python -m unittest discover -s python/tests
      - name: Install wheel and run tests in container
        if: ${{ matrix.image }}
        run: >
          docker run --rm -v ${{ github.workspace }}:/build -w /build
          ${{ matrix.image }} sh -c
          "pip install --no-index --find-links dist zeroset-anydoc &&
          python -m unittest discover -s python/tests"
      - name: Install wheel and run tests (x86_64 via Rosetta)
        if: ${{ matrix.macos_x64 }}
        run: |
          arch -x86_64 python -m pip install --no-index --find-links dist zeroset-anydoc
          arch -x86_64 python -m unittest discover -s python/tests

  publish:
    name: Publish internal wheels
    needs: [gate, test-wheels]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: internal-package-publish
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CODEARTIFACT_DOMAIN: zeroset
      CODEARTIFACT_DOMAIN_OWNER: '372867010033'
      CODEARTIFACT_PUBLISH_URL: https://zeroset-372867010033.d.codeartifact.us-east-1.amazonaws.com/pypi/nebula-anydoc/
      CODEARTIFACT_SIMPLE_URL: https://zeroset-372867010033.d.codeartifact.us-east-1.amazonaws.com/pypi/nebula-anydoc/simple/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nebula-wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::372867010033:role/github-anydoc-codeartifact-publisher
      - name: Publish wheels
        run: |
          token=$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --duration-seconds 0 \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$token"
          UV_PUBLISH_USERNAME=aws \
          UV_PUBLISH_PASSWORD="$token" \
          uv publish \
            --publish-url "$CODEARTIFACT_PUBLISH_URL" \
            --check-url "$CODEARTIFACT_SIMPLE_URL" \
            --no-attestations \
            dist/*.whl
