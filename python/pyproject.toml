[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The internal distribution installs as `zeroset-anydoc` and imports as
# `anydoc`. A distinct name prevents accidental resolution to upstream PyPI.
[project]
name = "zeroset-anydoc"
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["markdown", "docx", "pdf", "pptx", "xlsx", "epub", "converter", "document"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
# The version comes from Cargo.toml `package.version`.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zeroset-inc/anydoc#readme"
Repository = "https://github.com/zeroset-inc/anydoc"
Issues = "https://github.com/zeroset-inc/anydoc/issues"

[tool.maturin]
module-name = "anydoc._anydoc"
